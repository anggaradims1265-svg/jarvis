
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses + install NDK/CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;27.0.12077973" \
            "cmake;3.22.1" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          touch local.properties
          if ! grep -q '^ndk.dir=' local.properties; then
            echo "ndk.dir=$ANDROID_HOME/ndk/27.0.12077973" >> local.properties
          fi

      - name: Build debug APK + unit tests
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon --stacktrace

      # Verify minified release variant before publishing.
      - name: Build minified release (CI gate)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Notify Telegram on failure
        if: failure()
        continue-on-error: true
        env:
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$BOT" ] || [ -z "$CHAT" ]; then
            echo "Telegram secrets are not configured. Skipping notification."
            exit 0
          fi

          curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot${BOT}/sendMessage" \
            -d "chat_id=${CHAT}" \
            --data-urlencode "text=⚠️ JARVIS CI build FAILED on ${GITHUB_SHA} — check https://github.com/ansaribilal14/jarvis/actions"
            
